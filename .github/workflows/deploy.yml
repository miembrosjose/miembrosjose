name: Deploy to Cloudflare Workers

# Publica automaticamente no Cloudflare a cada push na main.
# O build roda em Linux (ubuntu) — evita a incompatibilidade do OpenNext com Windows.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (OpenNext → Cloudflare)
        run: npx opennextjs-cloudflare build
        env:
          # NEXT_PUBLIC_* são inlined no bundle do navegador em tempo de build.
          # Precisam estar presentes AQUI (não bastam as vars de runtime do Worker).
          # Valores públicos (mesmos do wrangler.jsonc).
          NEXT_PUBLIC_SUPABASE_URL: https://kjozrcugsywykpuvuqzu.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtqb3pyY3Vnc3l3eWtwdXZ1cXp1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1OTcwNTMsImV4cCI6MjA5NjE3MzA1M30.bp8_Une8jnLU8kMXjPBOGb04h1LgyFEZBLickodyajs

          # ── LAS QUE FALTABAN, Y POR QUÉ NO SE NOTABA ──────────────────
          # El build NO falla si una NEXT_PUBLIC_* no está: Next la sustituye
          # por `undefined` y sigue. El paquete sale roto sin un solo aviso.
          #
          # Sin la clave de Stripe, el formulario de tarjeta no llega a
          # dibujarse. Se ve el botón de pagar y al pulsarlo no pasa nada —
          # pero SOLO le ocurre a quien no tenga ya una tarjeta guardada, o
          # sea a quien compra por primera vez. Quien ya tenía tarjeta cobra
          # bien, y por eso pasó meses sin detectarse.
          #
          # La `pk_live_` es PÚBLICA por diseño: viaja al navegador de todo el
          # que entra. La secreta es la `sk_live_`, y esa nunca va en el repo.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_live_51RQ8vaIwAkyNHR0CERYYwfFvt2z9zpgyfqVGe62DabtneJeAVe5rSgPZSs60xtjyPlU6MUvgYEG33b3PvBuc3mAG00W3Nswl15

          # Sin esto, el enlace del correo de invitación apunta a
          # https://miembros.SEU_DOMINIO.com — un dominio que no existe.
          NEXT_PUBLIC_MIEMBROS_URL: https://los144000.com

      - name: Deploy (Wrangler)
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 9eb16354b4057b7506df99d12e3463e7
