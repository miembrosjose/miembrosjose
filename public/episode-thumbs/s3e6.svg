    <text x="22" y="35" font-family="monospace" font-size="10" fill="#c9a961" letter-spacing="3" opacity="0.75">EP · TEMPORADA 3</text>
    <!-- Símbolo temático à direita -->
    
      <!-- Integração de vídeo no V0 (player + code brackets) -->
      <!-- Player frame -->
      <rect x="246" y="80" width="128" height="80" rx="3" fill="none" stroke="#c9a961" stroke-width="2"/>
      <!-- Play button central -->
