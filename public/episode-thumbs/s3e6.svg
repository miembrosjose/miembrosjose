      <line x1="252" y1="152" x2="368" y2="152" stroke="#c9a961" stroke-width="1" opacity="0.4"/>
      <line x1="252" y1="152" x2="305" y2="152" stroke="#c9a961" stroke-width="2" opacity="0.9"/>
      <circle cx="305" cy="152" r="2.5" fill="#c9a961"/>
      <!-- Code brackets ao redor (V0 integration) -->
      <text x="232" y="125" font-family="monospace" font-size="32" fill="#c9a961" font-weight="700" opacity="0.7">&lt;</text>
      <text x="378" y="125" font-family="monospace" font-size="32" fill="#c9a961" font-weight="700" opacity="0.7">/&gt;</text>
      <!-- Linha de código abaixo -->
      <text x="244" y="195" font-family="monospace" font-size="9" fill="#c9a961" opacity="0.5" letter-spacing="1">&lt;video src="..." /&gt;</text>
      <!-- Sparkle V0 -->
      <path d="M 360 60 L 362 56 L 364 60 L 368 62 L 364 64 L 362 68 L 360 64 L 356 62 Z" fill="#c9a961" opacity="0.85"/>
    
    <!-- Número gigante à esquerda -->
    <text x="40" y="180" font-family="serif" font-weight="700" font-size="160" fill="#c9a961" opacity="0.92" style="letter-spacing:-0.04em">06</text>
    <!-- Label do episódio (subtítulo) -->
    <text x="40" y="215" font-family="serif" font-size="13" fill="#c9a961" opacity="0.65" letter-spacing="6" style="text-transform:uppercase">V0 Integration</text>
    <!-- Vinheta -->
    <rect width="400" height="250" fill="url(#vig-video-integration-6)"/>
    <!-- Linha bottom decorativa -->
    <line x1="40" y1="225" x2="200" y2="225" stroke="#c9a961" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="248" x2="400" y2="248" stroke="#c9a961" stroke-width="2" opacity="0.7"/>
    <!-- Grain overlay -->
