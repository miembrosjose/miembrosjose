      <line x1="246" y1="190" x2="346" y2="190" stroke="#c9a961" stroke-width="0.6" opacity="0.4"/>
      <circle cx="280" cy="190" r="1.8" fill="#c9a961" opacity="0.7"/>
      <circle cx="310" cy="190" r="1.8" fill="#c9a961"/>
      <circle cx="335" cy="190" r="1.8" fill="#c9a961" opacity="0.5"/>
    
    <!-- Número gigante à esquerda -->
    <text x="40" y="180" font-family="serif" font-weight="700" font-size="160" fill="#c9a961" opacity="0.92" style="letter-spacing:-0.04em">02</text>
    <!-- Label do episódio (subtítulo) -->
    <text x="40" y="215" font-family="serif" font-size="13" fill="#c9a961" opacity="0.65" letter-spacing="6" style="text-transform:uppercase">Clarity</text>
    <!-- Vinheta -->
    <rect width="400" height="250" fill="url(#vig-analytics-2)"/>
    <!-- Linha bottom decorativa -->
    <line x1="40" y1="225" x2="200" y2="225" stroke="#c9a961" stroke-width="1" opacity="0.5"/>
    <line x1="0" y1="248" x2="400" y2="248" stroke="#c9a961" stroke-width="2" opacity="0.7"/>
    <!-- Grain overlay -->
